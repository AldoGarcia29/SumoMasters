<div class="auth-page">
  <div class="auth-card">
    <app-auth-branding-panel class="auth-card__branding" />

    <div class="auth-card__form">
      <div class="auth-form">
        <h1 class="auth-form__title">Iniciar sesión</h1>
        <p class="auth-form__subtitle">
          Ingresa tus credenciales para acceder a la plataforma.
        </p>

        <form
          class="auth-form__fields"
          [formGroup]="form"
          (ngSubmit)="submit()"
          novalidate
        >
          <div
            *ngIf="justRegistered()"
            class="auth-form__alert auth-form__alert--success"
            role="status"
          >
            ✓ Cuenta creada correctamente. Inicia sesión para continuar.
          </div>

          <div
            *ngIf="errorMessage()"
            class="auth-form__alert"
            role="alert"
          >
            {{ errorMessage() }}
          </div>

          <label class="field">
            <span class="field__label">Usuario o correo electrónico</span>
            <span class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="m4 7 8 6 8-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <input
                type="text"
                formControlName="identifier"
                placeholder="ejemplo@correo.com"
                autocomplete="username"
              />
            </span>
            <span
              class="field__error"
              *ngIf="form.controls.identifier.touched && form.controls.identifier.invalid"
            >
              El usuario o correo es obligatorio
            </span>
          </label>

          <label class="field">
            <span class="field__label">Contraseña</span>
            <span class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18">
                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="10"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M8 10V7a4 4 0 1 1 8 0v3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
              </svg>
              <input
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••••"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="field__toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <svg *ngIf="!showPassword()" viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
                </svg>
                <svg *ngIf="showPassword()" viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="m3 3 18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.3 6.5C4 8 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.4 4.7-1.1M17.9 17.7C20.3 16 22 12 22 12s-1.6-3.2-4.6-5.3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </span>
            <span
              class="field__error"
              *ngIf="form.controls.password.touched && form.controls.password.invalid"
            >
              La contraseña es obligatoria
            </span>
          </label>

          <div class="auth-form__row">
            <label class="checkbox">
              <input type="checkbox" formControlName="remember" />
              <span>Recordarme</span>
            </label>
            <a class="link" href="javascript:void(0)">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn--primary" [disabled]="loading()">
            {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
          </button>

          <p class="auth-form__footer">
            ¿No tienes cuenta?
            <a class="link link--strong" routerLink="/auth/register">Regístrate aquí</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
