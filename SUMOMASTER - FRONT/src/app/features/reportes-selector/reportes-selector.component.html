<div class="app-shell">
  <app-sidebar [isOpen]="sidebarOpen()" (closeRequested)="closeSidebar()" />
  <div class="app-shell__backdrop" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <div class="app-shell__main">
    <app-topbar
      title="Reportes"
      subtitle="Dashboard › Reportes"
      [notificationCount]="3"
      (menuToggle)="toggleSidebar()"
    />

    <main class="selector-page">
      <section class="panel panel--header">
        <div class="panel--header__info">
          <span class="panel--header__icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            </svg>
          </span>
          <div>
            <h2>Reportes</h2>
            <p>Elige un torneo para exportar su ranking, resultados, historial y más.</p>
          </div>
        </div>
      </section>

      <section class="panel panel--table">
        <p class="table__loading" *ngIf="loading()">Cargando torneos…</p>

        <div class="table-wrapper" *ngIf="!loading()">
          <table class="table">
            <thead>
              <tr>
                <th>Torneo</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th class="table__actions-head">Reportes</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let torneo of torneos()">
                <td>{{ torneo.nombre }}</td>
                <td>{{ categoriaNombre(torneo) }}</td>
                <td><span class="badge" [class]="estadoBadgeClass(torneo.estado)">{{ torneo.estado }}</span></td>
                <td class="table__actions">
                  <a class="btn btn--primary btn--sm" [routerLink]="['/torneos', torneo._id, 'reportes']">Ver reportes</a>
                </td>
              </tr>

              <tr *ngIf="torneos().length === 0">
                <td colspan="4" class="table__empty">Todavía no hay torneos creados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
