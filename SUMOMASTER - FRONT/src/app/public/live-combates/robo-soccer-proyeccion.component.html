<section class="soccer" aria-label="Proyección de Robo Soccer">
  <header class="soccer-barra">
    <h2>Robo Soccer <span *ngIf="torneo() as actual">· {{ actual.nombre }}</span></h2>

    <label>
      Partidos visibles
      <select #cantidadVisible (change)="cambiarCantidad(cantidadVisible.value)">
        <option *ngFor="let opcion of cantidades" [value]="opcion">
          {{ opcion }}
        </option>
      </select>
    </label>
  </header>

  <p *ngIf="aviso()" class="soccer-aviso" role="status">{{ aviso() }}</p>

  <div class="soccer-grid" *ngIf="partidos().length" [attr.data-cantidad]="cantidad()">
    <article class="soccer-tarjeta" *ngFor="let tarjeta of tarjetas()">
      <header class="soccer-tarjeta__barra">
        <strong>{{ tarjeta.partido?.fase ?? 'Partido ' + (tarjeta.indice + 1) }}</strong>

        <select
          #partidoElegido
          [attr.aria-label]="'Elegir partido para la tarjeta ' + (tarjeta.indice + 1)"
          (change)="elegirPartido(tarjeta.indice, partidoElegido.value)"
        >
          <option value="" [selected]="!tarjeta.partido">Elegir partido</option>
          <option
            *ngFor="let partido of partidos()"
            [value]="partido.id"
            [selected]="tarjeta.partido?.id === partido.id"
          >
            {{ partido.fase }} · {{ partido.local }} vs. {{ partido.visitante }}
          </option>
        </select>
      </header>

     <div class="soccer-enfrentamiento" *ngIf="tarjeta.partido as partido; else vacia">
  <div
    class="soccer-equipo soccer-equipo--local"
    [class.soccer-ganador]="
      partido.resultado && partido.resultado.golesLocal > partido.resultado.golesVisitante
    "
  >
    <strong>{{ partido.local }}</strong>
  </div>

  <div class="soccer-centro">
    <div class="soccer-reloj" aria-live="polite" aria-atomic="true">
      <ng-container *ngIf="partido.marcador as goles; else sinMarcador">
        <span class="soccer-reloj__goles">
          {{ goles.golesLocal }}<i>–</i>{{ goles.golesVisitante }}
        </span>
      </ng-container>
      <ng-template #sinMarcador>
        <span class="soccer-reloj__vs">VS</span>
      </ng-template>
    </div>

    <small *ngIf="partido.marcador && !partido.resultado" class="soccer-en-vivo">
      En vivo
    </small>
  </div>

  <div
    class="soccer-equipo soccer-equipo--visitante"
    [class.soccer-ganador]="
      partido.resultado && partido.resultado.golesVisitante > partido.resultado.golesLocal
    "
  >
    <strong>{{ partido.visitante }}</strong>
  </div>
</div>

      <ng-template #vacia>
        <div class="soccer-espera">Selecciona un partido para proyectar</div>
      </ng-template>
    </article>
  </div>
</section>
