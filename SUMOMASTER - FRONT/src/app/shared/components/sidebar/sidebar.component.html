<aside class="sidebar" [class.sidebar--open]="isOpen">
  <div class="sidebar__logo">
    <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
      <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" fill="url(#sidebarLogoGradient)" />
      <defs>
        <linearGradient id="sidebarLogoGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a78bfa" />
          <stop offset="1" stop-color="#6d28d9" />
        </linearGradient>
      </defs>
      <circle cx="24" cy="18" r="6" fill="#f5f3ff" />
      <path
        d="M12 38c1.5-7 6-11 12-11s10.5 4 12 11"
        fill="none"
        stroke="#f5f3ff"
        stroke-width="4"
        stroke-linecap="round"
      />
    </svg>
    <span class="sidebar__logo-text">SUMO<br />MASTERS</span>

    <button type="button" class="sidebar__close-btn" aria-label="Cerrar menú" (click)="close()">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="m5 5 14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route ?? null"
      routerLinkActive="sidebar__item--active"
      [class.sidebar__item]="true"
      [class.sidebar__item--disabled]="!item.route"
      [attr.title]="!item.route ? 'Próximamente' : null"
      (click)="!item.route && $event.preventDefault()"
    >
      <span class="sidebar__item-icon">
        <svg *ngIf="item.icon === 'home'" viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="item.icon === 'trophy'" viewBox="0 0 24 24" width="18" height="18">
          <path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4Z" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M7 5H4v1a4 4 0 0 0 4 4M17 5h3v1a4 4 0 0 1-4 4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 12v3m-3 3h6m-6 0-1 2h8l-1-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg *ngIf="item.icon === 'users'" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M15.5 6a3 3 0 0 1 0 5.9M21 20c0-2.8-2-5.1-4.7-5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg *ngIf="item.icon === 'robot'" viewBox="0 0 24 24" width="18" height="18">
          <rect x="5" y="9" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="9.5" cy="14" r="1.3" fill="currentColor" />
          <circle cx="14.5" cy="14" r="1.3" fill="currentColor" />
          <path d="M12 9V6m-3.5 0h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="12" cy="4.5" r="1.2" fill="currentColor" />
        </svg>
        <svg *ngIf="item.icon === 'grid'" viewBox="0 0 24 24" width="18" height="18">
          <rect x="4" y="4" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="13" y="4" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="4" y="13" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="13" y="13" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <svg *ngIf="item.icon === 'swords'" viewBox="0 0 24 24" width="18" height="18">
          <path d="m4 20 7-7M20 4 9.5 14.5M14.5 9.5 20 4M4 20l3-1 1-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M13 4l7 7-2 2-7-7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="item.icon === 'file'" viewBox="0 0 24 24" width="18" height="18">
          <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M14 3v4h4M9 12h6m-6 4h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg *ngIf="item.icon === 'user'" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M5 20c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg *ngIf="item.icon === 'settings'" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.8-1.4-2-3.4-2.1.7a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.5 2.2a7.6 7.6 0 0 0-2.6 1.5l-2.1-.7-2 3.4L4.6 9.9a7.6 7.6 0 0 0 0 3l-1.8 1.6 2 3.4 2.1-.7c.75.65 1.63 1.16 2.6 1.5L10 22h4l.5-2.2a7.6 7.6 0 0 0 2.6-1.5l2.1.7 2-3.4-1.8-1.6Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="sidebar__item-label">{{ item.label }}</span>
      <svg *ngIf="item.hasChevron" class="sidebar__item-chevron" viewBox="0 0 24 24" width="14" height="14">
        <path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </nav>

  <div class="sidebar__footer-wrapper">
    <div class="sidebar__dropdown" *ngIf="isProfileMenuOpen()">
      <div class="sidebar__dropdown-header">
        <p class="sidebar__dropdown-name">{{ displayName() }}</p>
        <p class="sidebar__dropdown-role">{{ primaryRole() }}</p>
      </div>

      <div class="sidebar__dropdown-divider"></div>

      <button type="button" class="sidebar__dropdown-item sidebar__dropdown-item--danger" (click)="logout()">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Cerrar sesión
      </button>
    </div>

    <button
      type="button"
      class="sidebar__footer"
      (click)="toggleProfileMenu()"
      [attr.aria-expanded]="isProfileMenuOpen()"
    >
      <span class="sidebar__avatar">{{ initials() }}</span>
      <span class="sidebar__footer-text">
        <strong>{{ displayName() }}</strong>
        <small>{{ primaryRole() }}</small>
      </span>
      <svg
        class="sidebar__footer-chevron"
        [class.sidebar__footer-chevron--open]="isProfileMenuOpen()"
        viewBox="0 0 24 24"
        width="14"
        height="14"
      >
        <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</aside>
